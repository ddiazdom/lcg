name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libhts-dev cmake

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Integration tests
        run: python3 tests/test_fasta_access.py

      - name: Memory bounded test
        run: python3 tests/test_memory_bounded.py
